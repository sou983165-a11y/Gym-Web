<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>button</title>

       <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>
<body class=" ">

  
  <form class=" flex flex-col ml-16 gap-5">

    <label for="" class=""> Kilometer</label>
    <input type="number" id="kmeter" class="w-[200px]" >
    <button onclick="Kilometer()" class=" btn btn-primary  w-[80px] ml-16 ">result</button>

  </form>

  <script>
    function Kilometer(){
      let kmeter= document.getElementById('kmeter').value;
      let result=kmeter*1000;
      alert(result)


    }

  </script>
    
</body>
</html>
